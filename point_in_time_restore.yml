---
- name: 'Gather facts on all servers'
  hosts:
    - hacluster
  become: true
  gather_facts: true

- hosts:
    - hacluster[0]
  become: true
  gather_facts: false
  vars:
    stolon_pg_version: 17
    stolon_pg_bin_path: "/usr/pgsql-{{ stolon_pg_version }}/bin/"
    restore_data_dir: /data/postgres/data/restore
    pguser: postgres
    pggroup: postgres
    restore_vars:
      PGRESTORE: '{{ restore_data_dir }}'
      RESTORETARGETTIME: '2025-10-15 16:23:43'
      #RESTORETARGETXID: 
      #RESTORETARGETNAME: 
  tasks:

    - name: Create pgdata
      file:
        name: '{{ restore_data_dir }}'
        state: directory
        owner: '{{ pguser }}'
        group: '{{ pggroup }}'

    - name: Restore with wal-g
      command: '{{ walg_script_path }}/restore.sh'
      environment: '{{ restore_vars }}'
      become_user: postgres
      vars:
        walg_home: '/opt/wal-g'
        walg_script_path: '{{ walg_home }}/scripts'

    - name: Start postgres
      command: '{{ stolon_pg_bin_path }}/pg_ctl start'
      environment:
        PGDATA: '{{ restore_data_dir }}'
